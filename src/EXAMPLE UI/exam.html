<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Quần Áo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: Arial, sans-serif; }
        .navbar { background: #333; }
        .navbar-brand, .nav-link { color: white !important; }
        .banner { background: url('https://source.unsplash.com/1200x400/?fashion,clothes') no-repeat center; background-size: cover; height: 400px; }
        .product-card { transition: 0.3s; }
        .product-card:hover { transform: scale(1.05); }
        footer { background: #333; color: white; padding: 20px 0; text-align: center; }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Shop Quần Áo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Trang Chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Sản Phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Liên Hệ</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Banner -->
    <div class="banner d-flex align-items-center justify-content-center">
        <h1 class="text-white bg-dark px-4 py-2">Thời Trang Hot Nhất</h1>
    </div>
    
    <!-- Danh sách sản phẩm -->
    <div class="container mt-4">
        <h2 class="text-center mb-4">Sản Phẩm Nổi Bật</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://source.unsplash.com/400x400/?shirt" class="card-img-top" alt="Áo sơ mi">
                    <div class="card-body text-center">
                        <h5 class="card-title">Áo Sơ Mi</h5>
                        <p class="card-text">Giá: 350,000 VND</p>
                        <button class="btn btn-primary">Thêm vào giỏ</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://source.unsplash.com/400x400/?jacket" class="card-img-top" alt="Áo khoác">
                    <div class="card-body text-center">
                        <h5 class="card-title">Áo Khoác</h5>
                        <p class="card-text">Giá: 500,000 VND</p>
                        <button class="btn btn-primary">Thêm vào giỏ</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card product-card">
                    <img src="https://source.unsplash.com/400x400/?jeans" class="card-img-top" alt="Quần jeans">
                    <div class="card-body text-center">
                        <h5 class="card-title">Quần Jeans</h5>
                        <p class="card-text">Giá: 450,000 VND</p>
                        <button class="btn btn-primary">Thêm vào giỏ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="mt-4">
        <p>&copy; 2025 Shop Quần Áo. All Rights Reserved.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
