<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Josefin Sans', sans-serif;
            background-color: #8b827b;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            margin-left: 425px;
            background: #f8f7f5;
            padding: 40px;
            width: 450px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .login-btn {
            background: #a18d7c;
            color: white;
            border-radius: 20px;
            padding: 10px;
            width: 100%;
        }

        .login-btn:hover {
            background: #F65454;
            color: white;
        }

        .social-icons img {
            width: 30px;
            margin: 10px;
            cursor: pointer;
        }

        .remember-me {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .signup-link {
            font-size: 14px;
            margin-top: 10px;
        }

        .sign {
            display: inline-block;
            color: black;
            /* Để hiệu ứng scale hoạt động tốt hơn */
            transition: transform 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        .sign:hover {
            color: red;
            transform: scale(1.1);
        }

        .forgot {
            color: black;
            display: inline-block;
            /* Để hiệu ứng scale hoạt động tốt hơn */
            transition: transform 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        .forgot:hover {
            color: red;
            transform: scale(1.1);
        }

        .form-control {
            border: none;
            border-bottom: 1px solid #000;
            border-radius: 0;
            background: transparent !important;
            /* Loại bỏ nền trắng */
            box-shadow: none !important;
            outline: none !important;
            caret-color: #000;
            /* Giữ màu con trỏ */
        }

        .form-control:focus,
        .form-control:active {
            border-bottom: 1px solid #a18d7c;
            background: transparent !important;
            /* Đảm bảo không có nền trắng khi focus */
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <h3 class="text-white">WELCOME TO<br><b>TIỆM RỬA XE</b></h3>
        <div class="login-container mt-3">
            <h4>LOGIN</h4>
            <form>
                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="">
                </div>
                <div class="remember-me mb-3">
                    <div>
                        <input type="checkbox"> Remember
                    </div>
                    <a class="forgot" href="#" class="text-muted" style="text-decoration: none;">Forgot password</a>
                </div>
                <button type="submit" class="btn login-btn">LOGIN</button>
            </form>
            <p class="mt-3">or</p>
            <div class="social-icons">
                <img src="https://www.flaticon.com/svg/static/icons/svg/300/300221.svg" alt="Google">
                <img src="https://www.flaticon.com/svg/static/icons/svg/733/733547.svg" alt="Facebook">
            </div>
            <p class="signup-link text-muted">Don't have an account? <a class="sign" href="#"
                    style="text-decoration: none;">Signup</a></p>
        </div>
    </div>
</body>

</html>
